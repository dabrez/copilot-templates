name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only the base dependency and pytest. The analyze backends pull torch
      # and a 440MB spaCy model, and nothing under tests/ imports them.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Check the template path works without the optional backends
        run: |
          python -c "from slide_templater import cli; print('cli imports clean')"
          python -m slide_templater template \
            --input examples/sample.pptx \
            --config examples/config.json \
            --output /tmp/out.pptx
          test -s /tmp/out.pptx

      - name: Test
        run: pytest -q
